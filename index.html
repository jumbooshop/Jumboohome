<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JUMBOOSHOP</title>

  <!-- Google Fonts: Mali -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mali:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cream: '#FCF9F2',
              card: '#FFFFFF',
              yellow: '#F4C760',
              yellowDark: '#E0B045',
              yellowLight: '#FEF8EA',
              brown: '#543B32',
              brownLight: '#8C6D62',
              border: '#EFE3CE'
            }
          },
          fontFamily: {
            mali: ['Mali', 'cursive', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Mali', cursive, sans-serif;
      background-color: #FCF9F2;
      color: #543B32;
      background-image: 
        radial-gradient(#eedbc5 1.5px, transparent 1.5px),
        radial-gradient(#eedbc5 1.5px, #FCF9F2 1.5px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient yellow glow */
    .bg-glow-top-left {
      position: fixed;
      top: -100px;
      left: -100px;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(244, 199, 96, 0.28) 0%, rgba(252, 249, 242, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }
    .bg-glow-bottom-right {
      position: fixed;
      bottom: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(244, 199, 96, 0.22) 0%, rgba(252, 249, 242, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Falling Snow / Confetti Particle Container */
    #particle-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .snowflake {
      position: absolute;
      top: -30px;
      animation-name: fallAnimation;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
      opacity: 0.65;
      user-select: none;
    }

    @keyframes fallAnimation {
      0% {
        transform: translateY(-20px) rotate(0deg) translateX(0px);
      }
      50% {
        transform: translateY(50vh) rotate(180deg) translateX(25px);
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(-20px);
      }
    }

    /* Smooth Modal Transitions */
    .modal-backdrop {
      background-color: rgba(84, 59, 50, 0.45);
      backdrop-filter: blur(3px);
      transition: opacity 0.2s ease-in-out;
    }
  </style>
</head>

  <!-- Ambient Light Effect -->
  <div class="bg-glow-top-left"></div>

  <!-- Falling Snow / Shapes -->
  <div id="particle-container"></div>

  <!-- Audio Element -->
  <audio id="bg-audio" loop preload="auto">
