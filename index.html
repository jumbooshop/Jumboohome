<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUMBOOSHOP</title>
    <!-- Google Fonts: Mali -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FCF9F2',
                        'cream-card': '#FFFFFF',
                        'yellow-soft': '#FDF3D8',
                        'yellow-earth': '#F4C760',
                        'yellow-earth-hover': '#E0B44C',
                        'brown-dark': '#543B32',
                        'brown-light': '#8C746B',
                        'line-green': '#06C755'
                    },
                    fontFamily: {
                        sans: ['Mali', 'cursive', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 20px 40px -15px rgba(84, 59, 50, 0.07)',
                        'button': '0 4px 14px 0 rgba(244, 199, 96, 0.35)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #FCF9F2;
            background-image: radial-gradient(#F4C760 1.2px, transparent 1.2px);
            background-size: 24px 24px;
            color: #543B32;
            font-family: 'Mali', cursive, sans-serif;
            min-height: 100vh;
        }

        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(244, 199, 96, 0.25) 0%, rgba(252, 249, 242, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .snow-particle {
            position: fixed;
            top: -20px;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg) translateX(0);
                opacity: 0.8;
            }
            50% {
                transform: translateY(50vh) rotate(180deg) translateX(15px);
                opacity: 0.6;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) translateX(-15px);
                opacity: 0;
            }
        }

        .modal-backdrop {
            background-color: rgba(84, 59, 50, 0.4);
            backdrop-filter: blur(4px);
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #FCF9F2;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #F4C760;
            border-radius: 10px;
        }

        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <div class="ambient-glow"></div>
